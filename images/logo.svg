<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <!-- Background Tech Gradient -->
    <linearGradient id="wth-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="wth-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <!-- Ambient Shadow -->
    <filter id="wth-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#4f46e5" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Squircle Base with Glow -->
  <rect x="2" y="2" width="44" height="44" rx="12" fill="url(#wth-bg)" filter="url(#wth-glow)" />

  <!-- Inner Subtle Glass Grid Line -->
  <rect x="2.75" y="2.75" width="42.5" height="42.5" rx="11.25" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" fill="none" />

  <!-- Iconic Nexus Hub & Tool Geometry -->
  <g transform="translate(24, 24)">
    <!-- Connected Tool Nodes (Hub) -->
    <!-- Top Node -->
    <circle cx="0" cy="-11" r="3" fill="#ffffff" />
    <!-- Bottom Left Node -->
    <circle cx="-9.5" cy="5.5" r="3" fill="#ffffff" />
    <!-- Bottom Right Node -->
    <circle cx="9.5" cy="5.5" r="3" fill="#ffffff" />

    <!-- Connecting Network Lines -->
    <line x1="0" y1="-11" x2="0" y2="0" stroke="rgba(255,255,255,0.7)" stroke-width="2.5" stroke-linecap="round" />
    <line x1="-9.5" y1="5.5" x2="0" y2="0" stroke="rgba(255,255,255,0.7)" stroke-width="2.5" stroke-linecap="round" />
    <line x1="9.5" y1="5.5" x2="0" y2="0" stroke="rgba(255,255,255,0.7)" stroke-width="2.5" stroke-linecap="round" />

    <!-- Outer Orbital Tool Bracket - Left (<) -->
    <path d="M-7 -6 L-13 0 L-7 6" stroke="url(#wth-accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />

    <!-- Outer Orbital Tool Bracket - Right (>) -->
    <path d="M7 -6 L13 0 L7 6" stroke="url(#wth-accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />

    <!-- Center Pulse Core -->
    <circle cx="0" cy="0" r="4.5" fill="#ffffff" />
    <circle cx="0" cy="0" r="2.2" fill="#4f46e5" />
  </g>
</svg>
